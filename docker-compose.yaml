services:
  db:
    image: postgres:15.1-alpine
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 1s
      retries: 5

  backend:
    build: .
    command: bash -c "python manage.py migrate && python manage.py collectstatic -c --no-input && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - django_static:/app/static/

  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/usr/share/nginx/html/static/

  celery:
    build: .
    tty: true
    restart: on-failure
    env_file:
      - .env
    command: celery -A config worker -l INFO
    depends_on:
      - redis
      - db
      - backend

    volumes:
      - .:/backend

  celery-beat:
    build: .
    tty: true
    restart: on-failure
    env_file:
      - .env
    command: celery -A config beat -l INFO
    depends_on:
      - redis
      - db
      - backend

volumes:
  pg_data:
  django_static: